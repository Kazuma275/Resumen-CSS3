<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Responsive en CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }

    .form-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box; /* Asegura que el padding no haga que se salga el contenido */
    }

    input[type="submit"] {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
      width: 100%; /* Hace que el botón se ajuste al ancho del contenedor */
    }

    input[type="submit"]:hover {
      background-color: #2980b9;
    }

    .form-group {
      margin-bottom: 15px;
    }

    /* Estilo para campos de selección */
    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-color: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    /* Estilo para área de texto */
    textarea {
      resize: vertical;
    }

    /* Media queries para hacer el formulario responsive */
    @media (max-width: 768px) {
      .form-container {
        padding: 15px;
      }

      input[type="submit"] {
        padding: 10px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .form-container {
        padding: 10px;
      }

      input[type="submit"] {
        padding: 10px;
        font-size: 12px;
      }

      label {
        font-size: 14px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      textarea,
      select {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <h1>Formulario Responsive en CSS</h1>
  <a href="../index.html">Inicio</a>
    <a href="./index.html">Ejemplos</a>
    
  <div class="form-container">
    <form action="#" method="post">
      <!-- Campo de texto -->
      <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required>
      </div>

      <!-- Campo de correo electrónico -->
      <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <!-- Campo de contraseña -->
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
      </div>

      <!-- Campo de área de texto -->
      <div class="form-group">
        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" rows="4" required></textarea>
      </div>

      <!-- Campo de selección -->
      <div class="form-group">
        <label for="gender">Género:</label>
        <select id="gender" name="gender">
          <option value="male">Masculino</option>
          <option value="female">Femenino</option>
          <option value="other">Otro</option>
        </select>
      </div>

      <!-- Botón de envío -->
      <div class="form-group">
        <input type="submit" value="Enviar">
      </div>
    </form>
  </div>
</body>
</html>
